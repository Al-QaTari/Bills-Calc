# =============================================================================
# Treasury Bills Calculator - Pytest Configuration
# حاسبة أذون الخزانة - إعداد Pytest
# =============================================================================

[pytest]
minversion = 8.0

# Output and test settings
addopts = -ra -q --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    ui: User interface end-to-end tests (اختبارات واجهة المستخدم من البداية للنهاية)
    integration: Integration tests between multiple components (اختبارات تكامل بين أكثر من مكون)
    slow: Slow tests that can be skipped in daily testing (اختبار بطيء، يمكن تخطيه في الاختبارات اليومية)
    asyncio: Asynchronous tests (اختبارات غير متزامنة)

# Explicit asyncio mode for handling asynchronous tests
asyncio_mode = auto