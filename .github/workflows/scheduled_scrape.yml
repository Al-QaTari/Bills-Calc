name: Scrape Latest CBE Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13-21 * * 0,4' # كل ساعة من 4 عصراً حتى 12 مساءً بتوقيت مصر، يومي الأحد والخميس
    - cron: '0 5 * * *' # مرة واحدة يومياً الساعة 8 صباحاً بتوقيت مصر كفحص احتياطي

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # تبقى كما هي في حال أردت إضافة أي commit مستقبلاً

    # --- بداية التعديل: إضافة كل الأسرار المطلوبة ---
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      POSTGRES_URI: ${{ secrets.POSTGRES_URI }}
      AIVEN_REDIS_URI: ${{ secrets.AIVEN_REDIS_URI }}
      SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
    # --- نهاية التعديل ---

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- بداية التعديل: تثبيت الاعتماديات والمتصفح ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps
      # --- نهاية التعديل ---
      - name: Verify Environment Variables
        run: |
          echo "Verifying required environment variables..."
          if [ -z "${{ secrets.SENTRY_ENVIRONMENT }}" ]; then
            echo "::error::SENTRY_ENVIRONMENT secret is NOT set or is empty in GitHub Secrets."
            exit 1
          else
            echo "✅ SENTRY_ENVIRONMENT is set."
          fi
          
          if [ -z "${{ secrets.POSTGRES_URI }}" ]; then
            echo "::error::POSTGRES_URI secret is NOT set or is empty."
            exit 1
          else
            echo "✅ POSTGRES_URI is set."
          fi

      - name: Run data update script
        run: python update_data.py

      # ✅ هذه الخطوة الجديدة ستساعدنا على التأكد من وجود الملف
      - name: Verify file exists and commit
        run: |
          if [ -f "data/cbe_historical_data.db" ]; then
            echo "✅ The file data/cbe_historical_data.db exists. Proceeding with commit."
            # تشغيل git-auto-commit-action فقط إذا كان الملف موجودًا
            # هذه الطريقة تتجنب خطأ "Working tree clean"
            git config --global user.name "GitHub Actions"
            git config --global user.email "github-actions@github.com"
            git add data/cbe_historical_data.db
            git commit -m "Update CBE historical data [BOT]" || echo "No changes to commit"
            git push origin main # تأكد من أن 'main' هو اسم الفرع الرئيسي
          else
            echo "❌ The file data/cbe_historical_data.db was not found. Nothing to commit."
          fi
