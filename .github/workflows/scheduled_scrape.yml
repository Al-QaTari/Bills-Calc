name: Scrape Latest CBE Data

on:
  # يسمح بالتشغيل اليدوي من صفحة Actions في GitHub
  workflow_dispatch:

  # جدولة التشغيل التلقائي
  schedule:
    # GitHub بيشغّل الـ cron بتوقيت UTC ثابت، ومصر بتتغير بين UTC+2 (شتاءً) و UTC+3 (صيفًا).
    # عشان كده الجدولة واسعة (تغطي الحالتين) وخطوة "gate" تحت بتقارن بالساعة الفعلية
    # بتوقيت القاهرة (بتتظبط لوحدها مع الـ DST) وتكمّل بس جوه النافذة المطلوبة.

    # يومي الأحد والخميس، كل ساعة من 4 عصراً حتى 12 مساءً بتوقيت القاهرة
    - cron: '0 13-21 * * 0,4'

    # مرة واحدة يومياً الساعة 8 صباحاً بتوقيت القاهرة كفحص احتياطي
    # (5 UTC شتاءً / 6 UTC صيفًا؛ الـ gate بيسيب واحدة بس منهم)
    - cron: '0 5,6 * * *'

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check Cairo local time (DST-aware)
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          HOUR=$(TZ=Africa/Cairo date +%-H)
          echo "Cairo hour now: $HOUR (offset $(TZ=Africa/Cairo date +%z))"
          RUN=false
          if [ "$EVENT" != "schedule" ]; then
            RUN=true
          elif [ "$CRON" = "0 5,6 * * *" ]; then
            # الفحص الاحتياطي: الساعة 8 صباحاً بتوقيت القاهرة بالظبط
            [ "$HOUR" -eq 8 ] && RUN=true
          else
            # نافذة العطاء: من 16:00 لحد 24:00 بتوقيت القاهرة
            if [ "$HOUR" -ge 16 ] || [ "$HOUR" -eq 0 ]; then RUN=true; fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      # هذا الإذن ضروري للسماح لـ git-auto-commit-action بالكتابة على المستودع
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright Browsers and dependencies
        run: playwright install chromium --with-deps

      - name: Verify Core Environment Variables
        run: |
          echo "Verifying required environment variables..."
          if [ -z "${{ secrets.POSTGRES_URI }}" ]; then
            echo "::error::POSTGRES_URI secret is NOT set or is empty."
            exit 1
          fi
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is NOT set or is empty."
            exit 1
          fi
          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "::error::TELEGRAM_CHAT_ID secret is NOT set or is empty."
            exit 1
          fi

      - name: Run data update script
        # --- التعديل الأول: تمرير كل الأسرار المطلوبة للسكريبت ---
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTGRES_URI: ${{ secrets.POSTGRES_URI }}
          AIVEN_REDIS_URI: ${{ secrets.AIVEN_REDIS_URI }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_THRESHOLD: ${{ secrets.ALERTS_THRESHOLD || '0.5' }}
        run: python update_data.py

      # --- التعديل الثاني: إضافة فترة انتظار لمنع تضارب قفل الملف ---
      - name: Wait for file lock to release
        run: sleep 5s

      - name: Commit and push if data changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update CBE historical data [BOT]"
          # هذا النمط يضمن أن الـ commit يحدث فقط إذا تغير ملف قاعدة البيانات
          file_pattern: data/cbe_historical_data.db
