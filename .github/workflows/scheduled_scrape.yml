name: Scrape Latest CBE Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13-21 * * 0,4' # كل ساعة من 4 عصراً حتى 12 مساءً بتوقيت مصر، يومي الأحد والخميس
    - cron: '0 5 * * *' # مرة واحدة يومياً الساعة 8 صباحاً بتوقيت مصر كفحص احتياطي

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # هذا ضروري للسماح للورك فلو بالكتابة على المستودع

    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      POSTGRES_URI: ${{ secrets.POSTGRES_URI }}
      AIVEN_REDIS_URI: ${{ secrets.AIVEN_REDIS_URI }}
      SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps

      - name: Verify Environment Variables
        run: |
          echo "Verifying required environment variables..."
          if [ -z "${{ secrets.SENTRY_ENVIRONMENT }}" ]; then
            echo "::error::SENTRY_ENVIRONMENT secret is NOT set or is empty in GitHub Secrets."
            exit 1
          else
            echo "✅ SENTRY_ENVIRONMENT is set."
          fi
          
          if [ -z "${{ secrets.POSTGRES_URI }}" ]; then
            echo "::error::POSTGRES_URI secret is NOT set or is empty."
            exit 1
          else
            echo "✅ POSTGRES_URI is set."
          fi

      - name: Run data update script
        run: python update_data.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update CBE historical data [BOT]"
          file_pattern: data/cbe_historical_data.db
