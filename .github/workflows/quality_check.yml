name: Python Code Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # --- تم تغيير الصلاحيات هنا للسماح بالكتابة ---
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest pytest-mock

      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps

      - name: Run tests (and skip UI tests)
        run: pytest -m "not ui"

      - name: Lint with ruff
        run: ruff check .

      # --- بداية التعديل: التنسيق والرفع التلقائي ---
      - name: Check files using the black formatter
        uses: psf/black@stable
        with:
          options: "--verbose"
          src: "."

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format Python code with Black"
      # --- نهاية التعديل ---
