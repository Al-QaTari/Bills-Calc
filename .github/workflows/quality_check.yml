name: Python Code Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # --- تم تغيير الصلاحيات هنا للسماح بالكتابة ---
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black  # pytest and pytest-mock come pinned from requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps

      # اختبارات الواجهة (test_ui.py) بتتوقع تطبيق Streamlit شغال على المنفذ 8501
      - name: Start Streamlit app for UI tests
        run: |
          nohup streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/healthz > /dev/null; then echo "app is up"; break; fi
            sleep 2
          done
          curl -sf http://localhost:8501/healthz > /dev/null || { echo "app failed to start"; cat streamlit.log; exit 1; }

      - name: Run tests
        run: pytest

      - name: Lint with ruff
        run: ruff check .

      # --- بداية التعديل: التنسيق والرفع التلقائي ---
      - name: Check files using the black formatter
        uses: psf/black@stable
        with:
          options: "--verbose"
          src: "."

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format Python code with Black"
      # --- نهاية التعديل ---
