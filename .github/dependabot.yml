# تحديثات Dependabot الشهرية: اعتمادات بايثون وأكشنز GitHub
# التحديثات الكبيرة (major) مستثناة عمداً لأنها ممكن تكسر التطبيق (مثل SQLAlchemy وredis وplotly).
# التحديثات الصغيرة والأمنية بتفضل شغالة.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
